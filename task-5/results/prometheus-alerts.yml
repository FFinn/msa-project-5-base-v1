groups:
  - name: tradeware-batch
    rules:
      - alert: TradeWareBatchJobFailed
        expr: increase(tradeware_batch_jobs_failed_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          service: report-batch-worker
          team: backend
        annotations:
          summary: "Spring Batch job failed"
          description: "At least one batch job failed after retries during the last 5 minutes."
          runbook: "docs/runbooks/batch-job-failed.md"

      - alert: TradeWareBatchAverageDurationHigh
        expr: |
          sum(rate(tradeware_batch_job_duration_seconds_sum[10m]))
          /
          sum(rate(tradeware_batch_job_duration_seconds_count[10m]))
          > 30
        for: 5m
        labels:
          severity: warning
          service: report-batch-worker
          team: backend
        annotations:
          summary: "Average batch processing time is above 30 seconds"
          description: "The 10-minute rolling average job duration has been above the business target for 5 minutes."
          runbook: "docs/runbooks/batch-sla.md"

      - alert: TradeWareQueueAgeHigh
        expr: tradeware_queue_oldest_message_age_seconds > 60
        for: 5m
        labels:
          severity: critical
          service: report-processing-queue
          team: backend
        annotations:
          summary: "Oldest report has been waiting in queue for too long"
          description: "Oldest message age is {{ $value }} seconds. Threshold must be tuned after load tests."
          runbook: "docs/runbooks/queue-backlog.md"

      - alert: TradeWareQueueDepthGrowing
        expr: deriv(tradeware_queue_depth[10m]) > 0
        for: 10m
        labels:
          severity: warning
          service: report-processing-queue
          team: backend
        annotations:
          summary: "Report processing backlog is continuously growing"
          description: "Queue depth has had a positive trend for 10 minutes."
          runbook: "docs/runbooks/queue-backlog.md"

      - alert: TradeWareDbPoolSaturationHigh
        expr: tradeware_db_pool_active_connections / tradeware_db_pool_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
          service: postgresql
          team: backend
        annotations:
          summary: "Database connection pool saturation above 80%"
          description: "Worker concurrency may be too high or DB queries may be slow."
          runbook: "docs/runbooks/db-saturation.md"

      - alert: TradeWareHighSkipRate
        expr: |
          sum(rate(tradeware_batch_rows_skipped_total[10m]))
          /
          clamp_min(sum(rate(tradeware_batch_rows_read_total[10m])), 1)
          > 0.01
        for: 10m
        labels:
          severity: warning
          service: report-batch-worker
          team: backend
        annotations:
          summary: "Skipped rows exceed 1%"
          description: "Potential input-data-quality regression. Threshold must be approved by business/data owner."
          runbook: "docs/runbooks/data-quality.md"

  - name: tradeware-api
    rules:
      - alert: TradeWareIntakeApiDown
        expr: up{job="report-intake-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: report-intake-service
          team: backend
        annotations:
          summary: "Report Intake API is unavailable"
          description: "Prometheus has been unable to scrape the Intake API for more than one minute."
          runbook: "docs/runbooks/intake-down.md"

      - alert: TradeWareIntakeHigh5xxRate
        expr: |
          sum(rate(http_server_requests_total{job="report-intake-service",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_total{job="report-intake-service"}[5m])), 1)
          > 0.05
        for: 5m
        labels:
          severity: critical
          service: report-intake-service
          team: backend
        annotations:
          summary: "Report Intake API 5xx rate above 5%"
          description: "Server error ratio has been above 5% for 5 minutes."
          runbook: "docs/runbooks/intake-errors.md"
