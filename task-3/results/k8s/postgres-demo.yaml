apiVersion: v1
kind: Secret
metadata:
  name: shipments-db-secret
type: Opaque
stringData:
  POSTGRES_DB: logistics
  POSTGRES_USER: logistics
  POSTGRES_PASSWORD: logistics-demo-password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shipments-db-init
  labels:
    app: shipments-db
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS shipments (
        id BIGSERIAL PRIMARY KEY,
        client_id BIGINT NOT NULL,
        driver_id BIGINT NOT NULL,
        vehicle_id BIGINT NOT NULL,
        status VARCHAR(32) NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    INSERT INTO shipments (client_id, driver_id, vehicle_id, status, created_at) VALUES
      (101, 1001, 501, 'delivered', now() - interval '2 hours'),
      (102, 1002, 502, 'in_transit', now() - interval '1 hour'),
      (103, 1003, 503, 'created', now());
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipments-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipments-db
  template:
    metadata:
      labels:
        app: shipments-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: shipments-db-secret
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "logistics", "-d", "logistics"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
      volumes:
        - name: init
          configMap:
            name: shipments-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: shipments-db
spec:
  selector:
    app: shipments-db
  ports:
    - port: 5432
      targetPort: 5432
